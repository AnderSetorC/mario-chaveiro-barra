<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Ilustração isométrica de fechadura residencial com chave entrando">
  <defs>
    <linearGradient id="bg4c" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A0A0A"/>
      <stop offset="100%" stop-color="#1A1A1A"/>
    </linearGradient>
    <linearGradient id="lime4c" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9FCC2E"/>
      <stop offset="100%" stop-color="#7FA523"/>
    </linearGradient>
    <linearGradient id="limeLight4c" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C5E05A"/>
      <stop offset="100%" stop-color="#9FCC2E"/>
    </linearGradient>
    <linearGradient id="doorc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3A2A1A"/>
      <stop offset="100%" stop-color="#1A1A1A"/>
    </linearGradient>
    <linearGradient id="lockc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9FCC2E"/>
      <stop offset="50%" stop-color="#7FA523"/>
      <stop offset="100%" stop-color="#5A7A18"/>
    </linearGradient>
    <filter id="shadow4c" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dx="0" dy="12" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.6"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg4c)"/>
  <g stroke="#9FCC2E" stroke-width="1" opacity="0.06">
    <line x1="0" y1="450" x2="1200" y2="450"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="0" y1="550" x2="1200" y2="550"/>
    <line x1="600" y1="450" x2="600" y2="675"/>
  </g>
  <g transform="translate(600 340)">
    <ellipse cx="0" cy="180" rx="240" ry="20" fill="#000" opacity="0.5"/>
    <path d="M -200 -180 L 200 -180 L 200 180 L -200 180 Z" fill="url(#doorc)" stroke="#0A0A0A" stroke-width="2"/>
    <g stroke="#9FCC2E" stroke-width="0.5" opacity="0.15">
      <line x1="-200" y1="-100" x2="200" y2="-100"/>
      <line x1="-200" y1="0" x2="200" y2="0"/>
      <line x1="-200" y1="100" x2="200" y2="100"/>
    </g>
  </g>
  <g transform="translate(600 340)" filter="url(#shadow4c)">
    <rect x="-60" y="-100" width="120" height="200" fill="url(#lockc)" rx="12"/>
    <rect x="-60" y="-100" width="120" height="30" fill="#7FA523" rx="12"/>
    <rect x="-60" y="70" width="120" height="30" fill="#5A7A18" rx="12"/>
    <circle cx="0" cy="0" r="40" fill="#0A0A0A" stroke="#1A1A1A" stroke-width="3"/>
    <circle cx="0" cy="0" r="30" fill="none" stroke="#9FCC2E" stroke-width="2" opacity="0.6"/>
    <circle cx="0" cy="0" r="18" fill="none" stroke="#9FCC2E" stroke-width="1.5"/>
    <rect x="-3" y="0" width="6" height="20" fill="#9FCC2E"/>
    <circle cx="-20" cy="-50" r="4" fill="#0A0A0A"/>
    <circle cx="20" cy="-50" r="4" fill="#0A0A0A"/>
  </g>
  <g transform="translate(700 340) rotate(45)" filter="url(#shadow4c)">
    <ellipse cx="0" cy="80" rx="100" ry="10" fill="#000" opacity="0.4"/>
    <rect x="-8" y="-10" width="100" height="20" fill="url(#limeLight4c)" rx="4"/>
    <path d="M 92 -10 L 200 -10 L 210 -6 L 210 0 L 200 4 L 192 4 L 192 8 L 175 8 L 175 4 L 92 4 Z" fill="url(#limeLight4c)"/>
    <path d="M 155 4 L 155 8 M 175 4 L 175 8" stroke="#0A0A0A" stroke-width="1.2"/>
    <circle cx="-30" cy="0" r="20" fill="none" stroke="url(#lime4c)" stroke-width="6"/>
    <circle cx="-30" cy="0" r="20" fill="none" stroke="url(#limeLight4c)" stroke-width="2" opacity="0.6"/>
    <rect x="-15" y="-3" width="12" height="6" fill="#0A0A0A"/>
