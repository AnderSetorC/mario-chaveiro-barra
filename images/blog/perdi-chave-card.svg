    <circle cx="240" cy="-30" r="8" fill="url(#limeLightc)"/>
    <circle cx="240" cy="-30" r="18" fill="#9FCC2E" opacity="0.3"/>
    <ellipse cx="-150" cy="40" rx="30" ry="20" fill="#0A0A0A" stroke="#9FCC2E" stroke-width="2"/>
