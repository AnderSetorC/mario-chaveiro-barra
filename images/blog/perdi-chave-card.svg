    <line x1="0" y1="600" x2="1200" y2="600"/>
    <line x1="200" y1="450" x2="0" y2="675"/>
    <line x1="400" y1="450" x2="200" y2="675"/>
    <line x1="600" y1="450" x2="600" y2="675"/>
    <line x1="800" y1="450" x2="1000" y2="675"/>
    <line x1="1000" y1="450" x2="1200" y2="675"/>
  </g>
  <g transform="translate(450 480)" filter="url(#shadow1c)">
