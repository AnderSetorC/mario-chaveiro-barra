<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Ilustração isométrica de chave caindo perto de carro destrancado">
  <defs>
    <linearGradient id="bg1c" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A0A0A"/>
      <stop offset="100%" stop-color="#1A1A1A"/>
    </linearGradient>
    <linearGradient id="lime1c" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9FCC2E"/>
      <stop offset="100%" stop-color="#7FA523"/>
    </linearGradient>
    <linearGradient id="limeLightc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C5E05A"/>
      <stop offset="100%" stop-color="#9FCC2E"/>
    </linearGradient>
    <linearGradient id="carTopc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2A2A2A"/>
